name: Data Engineering CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Optional: install project requirements if they exist
          # pip install -r requirements.txt
          
      - name: Lint Python Scripts with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  dbt-compile-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dbt-postgres
        run: pip install dbt-postgres
        
      - name: Run dbt Compile
        run: |
          cd dbt_nyc
          # This purely checks if the SQL syntax is valid dbt jinja, without needing a live database connection
          dbt deps
          dbt compile --target dev
